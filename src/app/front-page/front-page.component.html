<div class="maindiv">
  
  <div class="divmove atom-icon-container">
    <i class="fa-solid fa-atom"></i>
  </div>

  <div class="divmove atom-icon-container-image">
    <img src="../../assets/rocket.png" alt="rocket" style="width: 50px;">
  </div>

  <div class="namediv">
    <div class="name-wrapper">
      <h1 class="name-container">
        <span class="hvr-float-shadow main-name">Sayali Shelke</span>
      </h1>
      <div class="title-section">
        <h5 class="dev-title">Developer</h5>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
    
    <p class="description-text">
      Crafting exceptional digital experiences with modern web technologies
    </p>

    <div class="divspan">
      <span class="name-bounce-only">Html</span>
      <span class="name-bounce-only">Css</span>
      <span class="name-bounce-only">Typescript</span>
      <span class="name-bounce-only">Asp .Net Core</span>
      <span class="name-bounce-only">MySql</span>
    </div>

    <div class="buttonmaindiv">
      <div class="box-1">
        <div class="divmove">
          <img src="../../assets/computer.png" class="rocketimg" alt="computer">
        </div>
        <div class="btn-one" (click)="scrollToWork()">
          <button>View My Work</button>
        </div>
      </div>

      <div class="box-1">
        <div class="btn-one">
          <button>Get in touch</button>
        </div>
      </div>
    </div>

  </div>

</div>
