<div class="maindiv">
    <div class="arraydiv">
    <h1>Modern Web Capbilities</h1> 
        <div style="display: flex;justify-content: space-evenly;flex-wrap: wrap;">
    @for(modern of moderArr;track $index){
        <div style="background-color: rgb(52, 51, 51);width: 300px;height: fit-content;padding: 15px 0px 15px 15px;margin-bottom: 50px;">
        <img [src]="modern.modernImg" class="imgMove">
        <p style="color: white;font-size: 15px;font-weight: 600;">{{modern.label}}</p>
        <p style="color: rgb(181, 181, 181);font-size: 11px;white-space: pre-wrap;">{{modern.keyPoints}}</p>
        </div>
    }
    </div>
    </div>
</div>
