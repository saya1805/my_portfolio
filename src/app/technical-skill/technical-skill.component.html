<div class="maindiv" id="ProjectWorkSectiontech">
    <h1>Technical Expertise</h1>

    <div class="arraydiv">
        @for(techskill of arrays; track $index) {
            <div class="arrdiv2" [style.border]="'1px solid ' + techskill.border">
                
                <div class="arraydiv3">
                    <div><img [src]="techskill.img" class="imgfield" alt="tech-icon"></div>
                    <div class="textfield">{{techskill.Field}}</div>
                </div>
                
                @for(skills of techskill.Skill; track $index) {
                    <div class="skill-item-container">
                        <div class="array2div">
                            <div class="array2langtext">{{skills.Languages}}</div>
                            <div class="array2percent">{{skills.Percentage}}</div>
                        </div>

                        <div class="array2progess1">
                            <div class="array2progess2" [style.width]="skills.Percentage" [style.backgroundImage]="skills.color"></div>
                        </div>
                    </div>
                }
            </div>
        }
    </div>
</div>
